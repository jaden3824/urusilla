name: Conformance

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research.lock
      - name: Install exact research dependency set
        run: python -m pip install -r requirements-research.lock
      - name: Run root conformance and research tests
        shell: bash
        run: |
          mapfile -t modules < <(find . -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | LC_ALL=C sort)
          python -m unittest -v "${modules[@]%.py}"
      - name: Run task-bound hybrid runtime and initial-goal evidence tests
        run: |
          python -m unittest discover -s urusilla_hybrid_runtime/tests -p 'test_*.py' -v
          python -m unittest discover -s initial_goal_eval/tests -p 'test_*.py' -v
      - name: Run deterministic benchmark smoke test
        run: python urusilla_benchmark.py --messages 100 --repeats 2 --warmups 1 --corruptions 1 --output /tmp/benchmark.md
      - name: Run warm-profile benchmark smoke test
        run: python urusilla_wire_v02.py --benchmark --messages 280 --repeats 2 --warmups 1 --corruptions 1 --output /tmp/wire-v02.md
      - name: Run full A2A envelope benchmark tests
        run: python -m unittest -v test_urusilla_a2a_envelope_benchmark.py
      - name: Run neutral-ID transfer evaluator tests
        run: python -m unittest -v test_urusilla_hidden_transfer_evaluation.py
      - name: Run source-manifest vectors
        run: python -m unittest -v test_source_manifest.py
      - name: Validate the commit-bound release source manifest when present
        shell: bash
        run: |
          if [[ -f release/source_manifest.json ]]; then
            python source_manifest.py validate release/source_manifest.json
          else
            echo "No commit-bound release source manifest is present in this revision."
          fi
      - name: Validate Grammar Capsule JSON
        run: |
          python -m json.tool urusilla_capsule_v0_1.json >/dev/null
          python -m json.tool urusilla_action_state_capsule.json >/dev/null
          python -m json.tool urusilla_evolving_surface_capsule.json >/dev/null
          python -m json.tool urusilla_task_context.example.json >/dev/null
          python -m json.tool urusilla_output_validator.example.json >/dev/null
          python -m json.tool initial_goal_eval/frozen_method_plan.json >/dev/null
      - name: Enforce English-only documentation
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z -- \
            '*.md' '*.json' '*.cff' '*.yml' '*.yaml' '*.toml')
          failed=0
          for file in "${files[@]}"; do
            # Frozen multilingual semantic fixture data is not documentation.
            if [[ "$file" == "independent_impl/rust/vectors/v02_crossplay.json" ]]; then
              continue
            fi
            if grep -nP '[\x{AC00}-\x{D7AF}]' "$file"; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Repository documents and metadata must be English-only."
            exit 1
          fi
      - name: Reject retired product names and wire magic
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import re
          import subprocess

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\0")
          tracked = [pathlib.Path(raw.decode("utf-8")) for raw in tracked if raw]

          retired_product = bytes((97, 103, 101, 110, 116, 98, 97, 98, 101, 108))
          retired_short_name = bytes((115, 101, 109, 97))
          retired_interlingua = re.compile(
              bytes((97, 103, 101, 110, 116))
              + rb"[-_ ]?"
              + bytes((105, 110, 116, 101, 114, 108, 105, 110, 103, 117, 97))
          )
          retired_wire_tokens = (
              bytes((97, 98, 98, 108)),
              bytes((97, 98, 99, 112)),
              bytes((97, 98, 114, 55, 112)),
          )
          short_name = re.compile(
              rb"(?<![a-z0-9_])" + retired_short_name + rb"(?![a-z0-9_])"
          )
          base64_token = re.compile(
              rb"(?<![A-Za-z0-9+/])(?:[A-Za-z0-9+/]{4}){2,}"
              rb"(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?"
              rb"(?![A-Za-z0-9+/=])"
          )
          decoded_audit_exclusions = {
              pathlib.Path("independent_impl/rust/vectors/v02_crossplay.json"),
          }

          def retired_reason(value: bytes) -> str | None:
              lowered = value.lower()
              if retired_product in lowered:
                  return "retired product name"
              if retired_interlingua.search(lowered):
                  return "retired interlingua package/path"
              if short_name.search(lowered):
                  return "retired short name"
              if any(token in lowered for token in retired_wire_tokens):
                  return "retired wire token"
              return None

          failures: list[str] = []
          for path in tracked:
              path_bytes = path.as_posix().encode("utf-8")
              if reason := retired_reason(path_bytes):
                  failures.append(f"{reason} remains in path: {path}")
              data = path.read_bytes()
              if reason := retired_reason(data):
                  failures.append(f"{reason} remains in content: {path}")
              if path in decoded_audit_exclusions or b"\0" in data:
                  continue
              for match in base64_token.finditer(data):
                  try:
                      decoded = base64.b64decode(match.group(), validate=True)
                  except (ValueError, base64.binascii.Error):
                      continue
                  if reason := retired_reason(decoded):
                      failures.append(f"{reason} remains in decoded Base64: {path}")
                      break

          if failures:
              print("\n".join(failures))
              raise SystemExit("The public tree must contain only Urusilla identifiers.")
          PY

  strong-codec-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-research.lock
      - name: Install exact research dependency set
        run: python -m pip install -r requirements-research.lock
      - name: Run deterministic strong-codec tests
        run: python -m unittest -v test_urusilla_strong_codec_baselines.py

  tokenizer-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.lock
      - name: Install exact research dependency set
        run: python -m pip install -r requirements-research.lock
      - name: Configure isolated tokenizer cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tiktoken-cache"
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tiktoken-cache" >> "$GITHUB_ENV"
      - name: Download immutable official tokenizer assets
        run: >-
          python urusilla_tokenizer_benchmark.py
          --download-assets
          --output /tmp/tokenizer-accounting.md
      - name: Run deterministic tokenizer accounting tests
        run: >-
          python -m unittest -v
          test_urusilla_tokenizer_benchmark.py
          test_urusilla_token_surface_v03.py
          test_urusilla_token_surface_holdout.py
      - name: Run receiver-negotiated surface tests
        timeout-minutes: 25
        run: >-
          python -m unittest -v
          test_urusilla_terse_english_benchmark.py
          test_urusilla_token_surface_v04.py
          test_urusilla_adaptive_surface_v05.py
          test_urusilla_generalization_surface_v06.py
          test_urusilla_transparent_fallback_v08.py
          test_urusilla_session_delta_v09.py
          performance_v07.test_receiver_negotiated_surface_v07

  offline-integration-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.lock
      - name: Install exact research dependency set
        run: python -m pip install -r requirements-research.lock
      - name: Run claim-safety sentinel tests
        run: |
          python -m unittest discover -s sota_sentinel -p 'test_*.py' -v
          python sota_sentinel/check_registry.py --verify-digests
      - name: Run clean-clone competitive harness tests
        run: |
          python -m unittest discover -s competitive_eval/tests -p 'test_*.py' -v
          python -m competitive_eval.cli verify
      - name: Run adoption-kit Python tests and digest checks
        run: |
          python -m unittest discover -s adoption_kit/tests -p 'test_*.py' -v
          sha256sum --check adoption_kit/ARTIFACTS.sha256
      - name: Run public propagation-record validator tests
        run: |
          python -m unittest discover -s interop_lab/tests -p 'test_*.py' -v
          record="$RUNNER_TEMP/urusilla-propagation-chain.json"
          python interop_lab/interop_lab.py init "$record"
          python interop_lab/interop_lab.py validate "$record" --json
      - name: Run framework reproduction and dataset-pack tests
        run: |
          python -m unittest discover -s interop_lab/adapters/camel/tests -p 'test_*.py' -v
          python hf_dataset/validate.py --capsule urusilla_capsule_v0_1.json
      - name: Run decoder QA regressions and verify frozen evidence
        run: |
          python -m unittest -v decoder_qa.test_decoder_qa
          sha256sum --check decoder_qa/SHA256SUMS

  node-cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            adoption_kit/node/package.json
            independent_impl/rust/package.json
      - name: Run adoption-kit Node tests
        run: npm test --prefix adoption_kit/node
      - name: Run independent cross-runtime vector tests
        run: |
          npm run verify --prefix independent_impl/rust
          npm test --prefix independent_impl/rust
          npm run check-digests --prefix independent_impl/rust

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Install and smoke-test the built wheel
        shell: bash
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --force-reinstall --no-deps "$wheel"
          cd "$RUNNER_TEMP"
          urusilla demo --lang en >/dev/null
          urusilla-wire-v02 >/dev/null
          urusilla-source --help >/dev/null
          python - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import sysconfig
          import urusilla
          import urusilla_hybrid_runtime
          import urusilla_wire_v02
          import initial_goal_eval
          import source_manifest

          assert importlib.metadata.version("urusilla") == "0.1.0a0"
          assert urusilla.MAGIC == b"URSL\x01"
          assert urusilla_wire_v02.MAGIC == b"URSL\x02"
          assert source_manifest.LANGUAGE_VERSION == "0.1.0"
          assert (
              urusilla_hybrid_runtime.load_capsule().sha256
              == "sha256:7942bb348c3b2b839a3f87304b7d850796c837afdc66177eb1a48e5a45f0f778"
          )
          assert (
              urusilla_hybrid_runtime.EVOLVING_SURFACE_CAPSULE_SHA256
              == "sha256:b007fe91ee39abf9167b8d73a627f8ecba56c0f401850ac73b3981e534854848"
          )
          expected_data = {
              "urusilla_capsule_v0_1.json",
              "urusilla_v0_1_spec.md",
              "SOURCE_MANIFEST_FORMAT.md",
              "THIRD_PARTY_NOTICES.md",
              "source_manifest.schema.json",
              "urusilla_action_state_capsule.json",
              "urusilla_evolving_surface_capsule.json",
              "urusilla_output_validator.example.json",
              "urusilla_task_context.example.json",
              "EVOLVING_SURFACE.md",
              "LANGUAGE_EVOLUTION_ARCHITECTURE.md",
          }
          installed_data_dir = (
              Path(sysconfig.get_path("data")) / "share" / "urusilla"
          )
          installed_data = {
              path.name for path in installed_data_dir.iterdir() if path.is_file()
          }
          assert installed_data == expected_data
          PY
          target_dir="$RUNNER_TEMP/target-install"
          python -m pip install --no-deps --target "$target_dir" "$wheel"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$target_dir" python - <<'PY'
          import urusilla_hybrid_runtime

          capsule = urusilla_hybrid_runtime.load_capsule()
          assert (
              capsule.sha256
              == "sha256:7942bb348c3b2b839a3f87304b7d850796c837afdc66177eb1a48e5a45f0f778"
          )
          assert "target-install" in str(capsule.path)
          PY
